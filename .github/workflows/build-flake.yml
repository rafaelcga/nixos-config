name: Build NixOS systems

on:
  # No `paths` filter: non-Nix files (secrets, package sources) also feed the
  # systems, and a push whose systems are already cached finishes in seconds.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every `run` gets bash with pipefail
defaults:
  run:
    shell: bash

# A newer push to the same branch/PR supersedes a running build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Discovers hosts and builds, once, every derivation that two or more hosts
  # would otherwise build in parallel; the matrix jobs then pull it from Cachix.
  prepare:
    name: Discover hosts and build shared derivations
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Merge pull request')
    outputs:
      hosts: ${{ steps.get-hosts.outputs.hosts }}
    steps:
      - uses: wimpysworld/nothing-but-nix@v12
        with:
          hatchet-protocol: "cleave"

      - uses: actions/checkout@v7

      - name: Get NixOS hosts from directories
        id: get-hosts
        run: echo "hosts=$(find hosts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rnc '[inputs]')" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build derivations shared between hosts
        env:
          HOSTS: ${{ steps.get-hosts.outputs.hosts }}
        run: |
          # `--dry-run` queries the caches and lists only the .drv files that must
          # be built (none for a cached system); keep those listed by 2+ hosts
          for host in $(jq -r '.[]' <<<"$HOSTS"); do
            nix build --dry-run ".#nixosConfigurations.$host.config.system.build.toplevel" 2>&1 |
              sed -n 's|^ *\(/nix/store/.*\.drv\)$|\1|p' | sort -u
          done | sort | uniq -d >"$RUNNER_TEMP/shared"

          if [[ ! -s "$RUNNER_TEMP/shared" ]]; then
            echo "::notice title=Shared derivations::Nothing shared needs building"
            exit 0
          fi
          echo "Building $(wc -l <"$RUNNER_TEMP/shared") shared derivations:"
          sed 's/^/  /' "$RUNNER_TEMP/shared"
          # cachix-action pushes each output as it is built
          sed 's/$/^*/' "$RUNNER_TEMP/shared" | xargs nix build -L --no-link

  build-hosts:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.prepare.outputs.hosts) }}
    env:
      HOST: ${{ matrix.host }}
      # Only the automated update PR gets a package diff comment
      UPDATE_PR: ${{ github.event_name == 'pull_request' && github.head_ref == 'nix-flake-update' }}
    steps:
      - uses: wimpysworld/nothing-but-nix@v12
        with:
          hatchet-protocol: "cleave"

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and test flake
        id: build
        run: |
          # shellcheck disable=SC2016 # `${...}` below is Nix interpolation, not shell
          # Assigned first so an evaluation error fails the step; `--raw` prints
          # no trailing newline, which `<<<` adds (otherwise `read` returns 1)
          paths=$(nix eval --raw \
            ".#nixosConfigurations.$HOST.config.system.build.toplevel" \
            --apply 'system: "${system.drvPath} ${system.outPath}"')
          read -r drv out <<<"$paths"
          echo "out=$out" >>"$GITHUB_OUTPUT"

          # The store path hashes the whole configuration: if it is already in the
          # cache, an earlier run built this exact system, so there is nothing new
          # to verify (and no need to download its ~2000-path closure).
          if nix path-info --store https://rafaelcga.cachix.org "$out" &>/dev/null; then
            echo "::notice title=$HOST unchanged::$out is already cached; skipping build"
            exit 0
          fi

          nix build -L "$drv^*"

      # Writes this host's section of the package diff comment (see report-changes)
      - name: Diff closure against base branch
        if: env.UPDATE_PR == 'true'
        env:
          BASE: github:${{ github.repository }}/${{ github.event.pull_request.base.sha }}
          NEW_OUT: ${{ steps.build.outputs.out }}
        run: |
          md="$RUNNER_TEMP/$HOST.md"

          # Build the base system from its derivation rather than its bare output
          # path: a bare path can only be substituted, so it fails whenever that
          # exact revision was never built (e.g. a main push skipped by CI).
          # Anything already cached is still substituted, not rebuilt.
          if ! old_drv=$(nix eval --raw "$BASE#nixosConfigurations.$HOST.config.system.build.toplevel.drvPath") ||
            ! old_out=$(nix build --no-link --print-out-paths "$old_drv^*") ||
            ! nix build --no-link "$NEW_OUT"; then
            echo "::warning title=$HOST closure diff::Base system could not be evaluated or built; skipping package diff"
            printf '\n**%s**: _base system could not be evaluated or built, no diff available._\n' "$HOST" >"$md"
            exit 0
          fi

          # Same diff `nh` prints; --exit-code: 0 = identical, 1 = differs, 2 = error
          rc=0
          nix run nixpkgs#dix -- --color=never diff --exit-code \
            "$old_out" "$NEW_OUT" >"$RUNNER_TEMP/diff" || rc=$?
          case $rc in
            0) printf '\n**%s**: _No changes._\n' "$HOST" >"$md" ;;
            1)
              {
                printf '\n<details><summary><b>%s</b></summary>\n\n```\n' "$HOST"
                # Comments are capped at 65536 chars; `sed '$a\'` ends with one newline
                # shellcheck disable=SC1003
                head -c 15000 "$RUNNER_TEMP/diff" | sed '$a\'
                if (($(wc -c <"$RUNNER_TEMP/diff") > 15000)); then echo '… (truncated)'; fi
                printf '```\n\n</details>\n'
              } >"$md"
              ;;
            *) exit "$rc" ;;
          esac

      - name: Upload closure diff
        if: env.UPDATE_PR == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: closure-diff-${{ matrix.host }}
          path: ${{ runner.temp }}/${{ matrix.host }}.md
          retention-days: 1

  report-changes:
    name: Comment package changes on PR
    runs-on: ubuntu-latest
    needs: build-hosts
    if: github.event_name == 'pull_request' && github.head_ref == 'nix-flake-update'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: closure-diff-*
          merge-multiple: true
          path: ${{ runner.temp }}/diffs

      # A single comment, edited in place on every rebuild of the PR
      - name: Post package changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo "### Package changes"; cat "$RUNNER_TEMP"/diffs/*.md; } >"$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --edit-last --create-if-none --body-file "$RUNNER_TEMP/comment.md"

  # Single required status check: a failed `prepare` skips build-hosts, so check both
  check-builds:
    name: Check builds
    runs-on: ubuntu-latest
    needs: [prepare, build-hosts]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
