name: Build NixOS systems

on:
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - "flake.lock"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes a running build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-hosts:
    name: Discover NixOS hosts
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Merge pull request')
    outputs:
      hosts: ${{ steps.get-hosts.outputs.hosts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Get NixOS hosts from directories
        id: get-hosts
        run: |
          JSON_LIST=$(find ./hosts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -R . | jq -sc .)
          echo "hosts=$JSON_LIST" >>"$GITHUB_OUTPUT"

  build-hosts:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    needs: discover-hosts
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.discover-hosts.outputs.hosts) }}
    steps:
      - name: Nothing but Nix
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "cleave"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Enable unprivileged user namespaces (Fixes Bubblewrap/Nix sandboxing)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@v2026-06-15
        with:
          github_access_token: ${{ secrets.GH_TOKEN }}
          # Closures are thousands of small paths: download more of them in parallel
          extra_nix_config: |
            max-substitution-jobs = 64
            http-connections = 64

      - uses: cachix/cachix-action@v17
        with:
          name: rafaelcga
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and test flake
        run: |
          # shellcheck disable=SC2016 # `${...}` below is Nix interpolation, not shell
          # Assigned first so an evaluation error fails the step; `--raw` prints
          # no trailing newline, which `<<<` adds (otherwise `read` returns 1)
          paths=$(nix eval --raw \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            --apply 'system: "${system.drvPath} ${system.outPath}"')
          read -r drv out <<<"$paths"

          # The store path hashes the whole configuration: if it is already in the
          # cache, an earlier run built this exact system, so there is nothing new
          # to verify (and no need to download its ~2000-path closure).
          if nix path-info --store https://rafaelcga.cachix.org "$out" &>/dev/null; then
            echo "::notice title=${{ matrix.host }} unchanged::$out is already cached; skipping build"
            exit 0
          fi

          nix build -L "$drv^*"

  check-builds:
    name: Check builds
    runs-on: ubuntu-latest
    needs: build-hosts
    if: ${{ always() }}
    steps:
      - name: Check status of built hosts
        if: ${{ needs.build-hosts.result == 'failure' }}
        run: exit 1
