name: Update Flake

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  update-and-pr:
    name: Update and create PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@v2026-06-15
        with:
          github_access_token: ${{ secrets.GH_TOKEN }}
          extra_nix_config: |
            max-substitution-jobs = 64
            http-connections = 64

      - uses: cachix/cachix-action@v17
        with:
          name: rafaelcga
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Logs are tee'd so the PR body can list what actually changed.
      # `shell: bash` enables pipefail, so failures aren't masked by tee.
      - name: Update flake.lock
        shell: bash
        run: nix flake update 2>&1 | tee "$RUNNER_TEMP/flake.log"

      - name: Check Linux kernel update
        shell: bash
        run: ./scripts/update_kernel.sh | tee "$RUNNER_TEMP/kernel.log"

      - name: Run local packages update script
        shell: bash
        run: |
          # Restrict Nix concurrency to prevent OOM on standard runners
          mkdir -p ~/.config/nix
          echo "max-jobs = 1" >> ~/.config/nix/nix.conf
          echo "cores = 2" >> ~/.config/nix/nix.conf

          ./scripts/update_pkgs.sh | tee "$RUNNER_TEMP/pkgs.log"

      - name: Generate pull request body
        shell: bash
        run: |
          inputs="$(awk '/^• /{p=1; print; next} p && /^ /{print; next} {p=0}' "$RUNNER_TEMP/flake.log")"
          pkgs="$(grep -F 'updated:' "$RUNNER_TEMP/pkgs.log" | sed 's/^/- /' || true)"
          kernel=""
          if ! git diff --quiet -- flake.nix; then
            kernel="$(grep -F 'Kernel pinned' "$RUNNER_TEMP/kernel.log" || true)"
          fi

          {
            echo "Automated update of \`flake.lock\` and local Nix packages."
            echo
            echo "### Flake inputs"
            if [[ -n "$inputs" ]]; then
              printf '%s\n' '```' "$inputs" '```'
            else
              echo "_No changes._"
            fi
            echo
            echo "### Local packages"
            echo "${pkgs:-_No changes._}"
            if [[ -n "$kernel" ]]; then
              echo
              echo "### Linux kernel"
              echo "$kernel"
            fi
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: "chore(flake): update inputs and local packages"
          title: "chore(flake): update inputs and local packages"
          body-path: ${{ runner.temp }}/pr-body.md
          branch: "nix-flake-update"
          labels: dependencies
          delete-branch: true
