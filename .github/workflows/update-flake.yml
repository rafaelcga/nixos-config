name: Update Flake

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

# All writes (push, PR, labels) go through the GH_TOKEN PAT, so that the PR
# triggers build-flake.yml; the default token only needs to read.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  update-and-pr:
    name: Update and create PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Logs are tee'd so the PR body can list what actually changed
      # (pipefail keeps failures from being masked by tee).
      - name: Update flake.lock
        run: nix flake update 2>&1 | tee "$RUNNER_TEMP/flake.log"

      - name: Check Linux kernel update
        run: ./scripts/update_kernel.sh | tee "$RUNNER_TEMP/kernel.log"

      - name: Run local packages update script
        env:
          # Restrict Nix concurrency to prevent OOM on standard runners
          NIX_CONFIG: |
            max-jobs = 1
            cores = 2
        run: ./scripts/update_pkgs.sh | tee "$RUNNER_TEMP/pkgs.log"

      - name: Generate pull request body
        run: |
          inputs="$(awk '/^• /{p=1; print; next} p && /^ /{print; next} {p=0}' "$RUNNER_TEMP/flake.log")"
          pkgs="$(sed -n '/updated:/s/^/- /p' "$RUNNER_TEMP/pkgs.log")"
          kernel="$(grep -F 'Kernel pinned' "$RUNNER_TEMP/kernel.log" || true)"

          {
            echo "Automated update of \`flake.lock\` and local Nix packages."
            echo
            echo "### Flake inputs"
            if [[ -n "$inputs" ]]; then
              printf '%s\n' '```' "$inputs" '```'
            else
              echo "_No changes._"
            fi
            echo
            echo "### Local packages"
            echo "${pkgs:-_No changes._}"
            if [[ -n "$kernel" ]]; then
              printf '\n### Linux kernel\n%s\n' "$kernel"
            fi
          } >"$RUNNER_TEMP/pr-body.md"

      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: "chore(flake): update inputs and local packages"
          title: "chore(flake): update inputs and local packages"
          body-path: ${{ runner.temp }}/pr-body.md
          branch: nix-flake-update
          labels: dependencies
          delete-branch: true
