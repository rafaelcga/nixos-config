name: Update Flake

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  update-and-pr:
    name: Update and create PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GH_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: rafaelcga
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        run: nix flake update

      - name: Check Linux kernel update
        run: ./scripts/update_kernel.sh

      # Temporary: verify the Nix 2.35 lazy source copying theory.
      # The first call is expected to fail with 'opening file
      # "/nix/store/...-source": No such file or directory'; the second,
      # run after `nix flake archive`, should succeed if the theory holds.
      # Remove once the issue is resolved.
      - name: Test nix-update workaround
        continue-on-error: true
        run: |
          nix --version
          git status --short
          nix-shell -p nix-update --run 'nix-update cachyos-settings --flake --version=skip' || echo "FIRST CALL FAILED"
          nix flake archive .
          nix-shell -p nix-update --run 'nix-update cachyos-settings --flake --version=skip'

      - name: Run local packages update script
        run: |
          # Restrict Nix concurrency to prevent OOM on standard runners
          mkdir -p ~/.config/nix
          echo "max-jobs = 1" >> ~/.config/nix/nix.conf
          echo "cores = 2" >> ~/.config/nix/nix.conf

          ./scripts/update_pkgs.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: "chore: updated flake"
          title: "Updated Flake"
          body: Automated update of the `flake.lock` and local Nix packages.
          branch: "nix-flake-update"
          delete-branch: true
